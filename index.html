<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kevin Woodman</title>
    <script>
      <!--
        /*
        GitHub Pages doesn't support single-page applications.  This is a workaround.

        A broken link is directed to public/404.html, which will save that link's path portion
        and the referring URL in session storage then redirect the browser to the website's
        home page (this file).  Therefore, if a path is detected in session storage then it's
        transferred to the browser's history so that it's ready for React Router to handle.
        */

        const redirect = sessionStorage.redirect;
        const originalReferrer = sessionStorage.originalReferrer;

        if ((typeof redirect === "string") && (redirect !== window.location.pathname)) {
          if (typeof originalReferrer === "string") {
            window.history.replaceState({ originalReferrer }, "", redirect);
          }
        }

        delete sessionStorage.redirect;
        delete sessionStorage.originalReferrer;
      //-->
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
