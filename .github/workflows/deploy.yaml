name: Deploy to GitHub Pages

# This workflow takes the React website source files in the repository and builds them into a
# production website, then deploys the website to the kwoodman1970.github.io repository.
#
# This workflow must be triggered manually because the only branch used here is the main branch
# (for simplicity), and it can be updated into a non-production-ready state at any time for any
# reason.

# =============================================================================================
# DESIGN NOTES
# =============================================================================================

# There are two jobs in this workflow.  The first job builds the production version of the
# website and saves it in an artifact; the second one takes the saved artifact and deploys it
# to the external kwoodman1970.github.io repository.

# =============================================================================================
# CONFIGURATION
# =============================================================================================

on:
  workflow_dispatch:  # Allows manual triggering from the Actions tab

# Minimal permissions needed for this workflow
permissions:
  contents: read

# Allow only one deployment at a time; don't cancel in-progress runs
concurrency:
  group: "pages"
  cancel-in-progress: false

# =============================================================================================
# JOBS
# =============================================================================================

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"  # the latest version of Node.js as of this writing
          cache: "npm"

      # GitHub Pages serves the contents of "./public/404.html" for unknown paths which, in
      # turn, redirects the web browser to "./index.html" (which, in turn, loads the web
      # application as usual and renders a 404 page component).  However, many search engine &
      # AI agent crawlers stop when they receive a 404 response and never execute client-side
      # scripts.  This step gets around this problem by creating crawlable static entry points
      # for each React route.
      #
      # The result is that each valid React route has a corresponding static entry point that
      # loads the web application.  Crawlers can thus find and index these pages without
      # encountering 404 responses.

      - name: Generate static route entry points
        shell: bash

        # This is the process:
        #
        # 1.  Extract each string literal (in double quotes) route path from "/src/App.jsx"
        #     (e.g.:  <Route path="/example" ... />).
        # 2.  Isolate route values, sort them, and remove duplicates.
        # 3.  For each unique route:
        #     a.  Skip "/", "*", and empty routes.
        #     b.  Remove leading & trailing slashes so that each route can become a directory
        #         name.
        #     c.  Create the "./public/<route>/" directory and copy "./index.html" into it.

        run: |
          set -euo pipefail

          grep -oE '<Route[[:space:]]+path="[^"]+"' src/App.jsx \
            | sed -E 's/.*path="([^"]+)"/\1/' \
            | sort -u \
            | while IFS= read -r route; do
                case "$route" in
                  "/"|"*"|"") continue ;;
                esac

                route="${route#/}"
                route="${route%/}"
                [[ -z "$route" ]] && continue

                mkdir -p "public/$route"
                cp index.html "public/$route/index.html"
                echo "Created public/$route/index.html"
              done

      - name: Install dependencies
        run: npm ci

      - name: Build with Vite
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -d "./dist" ]; then
            echo "Error:  Build directory not found"
            exit 1
          fi
          echo "Build successful -- ./dist directory exists"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ./dist
          retention-days: 1  # Only keep for 1 day since we'll deploy immediately

  deploy:
    name: Deploy
    needs: build  # wait for the "Build" job to finish successfully
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: ./dist

      - name: Deploy to kwoodman1970.github.io
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: kwoodman1970/kwoodman1970.github.io
          publish_branch: main
          publish_dir: ./dist
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"