name: Deploy to GitHub Pages

# This workflow takes the React website source files in the repository and builds them into a
# production website, then deploys the website on the repository's GitHub Pages server.
#
# This workflow must be triggered manually because the only branch used here is the main branch
# (for simplicity), and it can be updated into a non-production-ready state at any time for any
# reason.

# =============================================================================================
# DESIGN NOTES
# =============================================================================================

# There are two jobs in this workflow.  The first job builds the production version of the
# website and saves it in an artifact; the second one takes the saved artifact and deploys it
# to GitHub Pages.

# =============================================================================================
# CONFIGURATION
# =============================================================================================

on:
  workflow_dispatch:  # Allows manual triggering from the Actions tab

# Grant the GITHUB_TOKEN the permissions needed to deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one deployment at a time; don't cancel in-progress runs
concurrency:
  group: "pages"
  cancel-in-progress: false

# =============================================================================================
# JOBS
# =============================================================================================

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"  # the latest version of Node.js as of this writing
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build with Vite
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -d "./dist" ]; then
            echo "Error:  Build directory not found"
            exit 1
          fi
          echo "Build successful -- ./dist directory exists"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist  # Vite outputs built websites to "./dist" by default

  deploy:
    name: Deploy
    needs: build  # wait for the "Build" job to finish successfully
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}  # show the URL in the Actions summary
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
